<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NaijaGrad Jobs</title>
<style>
:root{--g:#0b6b3a;--g2:#e7f4ec;--ink:#14201a;--mut:#5b6b62;--bd:#d8e2dc;--bg:#f6f9f7;--warn:#b45309;--err:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}header button{background:none;border:0;color:#fff;font-size:22px}
nav{display:flex;gap:4px;padding:8px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:50px;z-index:4}
nav button{flex:1;min-width:70px;border:0;background:none;padding:8px 4px;font-size:12px;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--g);border-color:var(--g);font-weight:700}nav button:disabled{opacity:.35}
main{padding:14px;max-width:720px;margin:0 auto}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 6px}h3{font-size:15px;margin:0 0 4px}p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
button.p,.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;width:100%;margin-top:8px;text-align:center;text-decoration:none}
button.s{background:var(--g2);color:var(--g)}button:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.chip{display:inline-block;background:var(--g2);color:var(--g);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.msg{padding:10px;border-radius:8px;margin:8px 0;font-size:14px}.msg.err{background:#fee2e2;color:var(--err)}.msg.ok{background:var(--g2);color:var(--g)}.msg.warn{background:#fef3c7;color:var(--warn)}
.files div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
.hide{display:none}pre.cl{white-space:pre-wrap;font:14px/1.4 inherit;background:var(--bg);padding:10px;border-radius:8px}
</style>
</head>
<body>
<header><h1>🇳🇬 NaijaGrad Jobs</h1><button id="gear" aria-label="Settings">⚙</button></header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
const S = { step:'docs', files:[], profile:null, cv:null, jobs:[], applied:{}, busy:false, err:'', info:'' };
const store = { get(k,d){try{return JSON.parse(localStorage.getItem('ngj_'+k))??d}catch{return d}}, set(k,v){try{localStorage.setItem('ngj_'+k,JSON.stringify(v))}catch{}} };
S.profile = store.get('profile',null); S.cv = store.get('cv',null); S.jobs = store.get('jobs',[]); S.applied = store.get('applied',{});
if (S.profile) S.step = S.cv ? 'jobs' : 'profile';
const cfg = () => ({ url:(store.get('server','')||(location.protocol.startsWith('http')?location.origin:'')).replace(/\/$/,''), code:store.get('code','') });
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, opts={}) {
  const {url,code} = cfg();
  if (!url) { S.step='settings'; throw new Error('Set your server address first (Settings)'); }
  const headers = {...(opts.headers||{})}; if (code) headers['x-access-code']=code;
  let r; try { r = await fetch(url+path,{...opts,headers}); } catch { throw new Error('Cannot reach the server. Check your internet and the server address in Settings.'); }
  if (!r.ok) { const j = await r.json().catch(()=>({})); throw new Error(j.error||('Server error '+r.status)); }
  return r;
}
const run = async fn => { S.busy=true; S.err=''; S.info=''; render(); try { await fn(); } catch(e){ S.err=e.message; } S.busy=false; render(); };
const busyBtn = (txt) => S.busy ? `<span class="spin"></span>Working… this can take a minute` : txt;

// ---- steps ----
const steps = [['docs','1 Upload'],['profile','2 Details'],['cv','3 CV'],['jobs','4 Jobs']];
function renderNav(){ $('#nav').innerHTML = steps.map(([k,l])=>{
  const dis = (k==='profile'&&!S.profile)||(k==='cv'&&!S.profile)||(k==='jobs'&&!S.cv);
  return `<button data-s="${k}" class="${S.step===k?'on':''}" ${dis?'disabled':''}>${l}</button>`}).join('');
  document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.step=b.dataset.s;S.err='';render()}); }

function msgs(){ return (S.err?`<div class="msg err">${esc(S.err)}</div>`:'')+(S.info?`<div class="msg ok">${esc(S.info)}</div>`:''); }

function vDocs(){ return `<div class="card"><h2>Upload your documents</h2>
<p class="mut">Add your degree certificate, transcript, WAEC/NECO result, NYSC certificate, professional certificates, or an old CV. PDF or photos (JPG/PNG). The app reads your name, grades and details from them.</p>
<input id="file" type="file" multiple accept="application/pdf,image/jpeg,image/png,image/webp">
<div class="files">${S.files.map((f,i)=>`<div><span>${esc(f.name)}</span><a href="#" data-rm="${i}">remove</a></div>`).join('')}</div>
<button class="p" id="read" ${S.busy||!S.files.length?'disabled':''}>${busyBtn('Read my documents')}</button></div>
<p class="mut">🔒 Your documents are sent to the server only to be read, and are not stored there. Your details are kept on this phone.</p>`; }
function bDocs(){ $('#file').onchange=e=>{S.files=[...S.files,...e.target.files];render()};
  document.querySelectorAll('[data-rm]').forEach(a=>a.onclick=e=>{e.preventDefault();S.files.splice(+a.dataset.rm,1);render()});
  $('#read').onclick=()=>run(async()=>{ const fd=new FormData(); S.files.forEach(f=>fd.append('files',f,f.name));
    const {profile}=await (await api('/api/profile/extract',{method:'POST',body:fd})).json();
    profile.email ||= ''; profile.phone ||= ''; S.profile=profile; store.set('profile',profile); S.cv=null; store.set('cv',null); S.step='profile'; S.info='Documents read. Please check the details below.'; }); }

function vProfile(){ const p=S.profile; const f=(k,l,t='text')=>`<label>${l}<input data-k="${k}" type="${t}" value="${esc(p[k])}"></label>`;
  return `<div class="card"><h2>Check your details</h2><p class="mut">Fix anything the app read wrongly. Add your email and phone — employers reply there.</p>
${f('fullName','Full name')}${f('email','Email','email')}${f('phone','Phone')}${f('profession','Job title to search for')}
<label>Education found</label>${(p.education||[]).map(e=>`<div class="mut">• ${esc(e.qualification)} ${e.field?'in '+esc(e.field):''} — ${esc(e.institution)} ${esc(e.classOfDegree||'')} ${esc(e.years||'')}</div>`).join('')||'<div class="mut">None found</div>'}
<label>Certifications</label>${(p.certifications||[]).map(c=>`<span class="chip">${esc(c.name)}</span>`).join('')||'<div class="mut">None found</div>'}
<label>Skills (comma separated)<textarea data-k="skills" rows="2">${esc((p.skills||[]).join(', '))}</textarea></label>
<label>Work experience / internships you want to add (optional, one per line)<textarea id="exp" rows="3" placeholder="e.g. Intern, Access Bank, 2023 – helped process customer accounts"></textarea></label>
<button class="p" id="mk" ${S.busy?'disabled':''}>${busyBtn('Create my CV')}</button></div>`; }
function bProfile(){ document.querySelectorAll('[data-k]').forEach(i=>i.oninput=()=>{ S.profile[i.dataset.k]= i.dataset.k==='skills'? i.value.split(',').map(s=>s.trim()).filter(Boolean) : i.value; store.set('profile',S.profile)});
  $('#mk').onclick=()=>run(async()=>{ const extra=$('#exp').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(extra.length) S.profile.experience=[...(S.profile.experience||[]),...extra.map(t=>({role:t,organisation:null,period:null,bullets:[]}))];
    if(!S.profile.email){throw new Error('Please enter your email — employers need it to reply.')}
    store.set('profile',S.profile);
    const {cv}=await (await api('/api/cv',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile:S.profile})})).json();
    cv.email ||= S.profile.email; cv.phone ||= S.profile.phone; S.cv=cv; store.set('cv',cv); S.step='cv'; }); }

function vCv(){ const c=S.cv; return `<div class="card"><h2>${esc(c.fullName)}</h2><p class="mut">${esc([c.email,c.phone,c.location].filter(Boolean).join(' | '))}</p>
<h3>Summary</h3><p>${esc(c.summary)}</p>
<h3>Education</h3>${(c.education||[]).map(e=>`<p><b>${esc(e.qualification)}${e.field?' in '+esc(e.field):''}</b> ${esc(e.classOfDegree||'')}<br><span class="mut">${esc(e.institution)} ${esc(e.years||'')}</span></p>`).join('')}
${(c.certifications||[]).length?`<h3>Certifications</h3>${c.certifications.map(x=>`<p>• ${esc([x.name,x.issuer,x.year].filter(Boolean).join(' - '))}</p>`).join('')}`:''}
${(c.experience||[]).length?`<h3>Experience</h3>${c.experience.map(x=>`<p><b>${esc(x.role)}</b> ${esc(x.organisation||'')}<br><span class="mut">${esc(x.period||'')}</span>${(x.bullets||[]).map(b=>`<br>• ${esc(b)}`).join('')}</p>`).join('')}`:''}
<h3>Skills</h3><p>${(c.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</p></div>
<button class="p s" id="dl" ${S.busy?'disabled':''}>${busyBtn('Download CV (PDF)')}</button>
<button class="p" id="find">Find jobs for me →</button>`; }
function bCv(){ $('#dl').onclick=()=>run(async()=>{ const r=await api('/api/cv/pdf',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({cv:S.cv})}); const blob=await r.blob(); const name=(S.cv.fullName||'CV').replace(/[^\w ]/g,'')+' - CV.pdf';
    if(window.AndroidBridge){ const b64=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.readAsDataURL(blob)}); S.info=AndroidBridge.savePdf(name,b64); }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); S.info='CV downloaded.'; } });
  $('#find').onclick=()=>{S.step='jobs';render();if(!S.jobs.length)search()}; }

function search(){ run(async()=>{ const {jobs}=await (await api('/api/jobs/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile:S.profile,location:$('#loc')?.value||''})})).json();
  S.jobs=jobs; store.set('jobs',jobs); if(!jobs.length) S.info='No open vacancies found right now. Try again later or change the job title in Details.'; }); }

function vJobs(){ return `<div class="card"><h2>Vacancies for ${esc(S.profile.profession||'you')}</h2>
<label>Preferred location (optional)<input id="loc" placeholder="e.g. Lagos, Abuja, Port Harcourt"></label>
<button class="p" id="srch" ${S.busy?'disabled':''}>${busyBtn(S.jobs.length?'Search again':'Search for open jobs')}</button>
<p class="mut">Jobs come from live web search. Always be wary of any employer asking you to pay money.</p></div>
${S.jobs.map((j,i)=>{const a=S.applied[j.applyUrl];return `<div class="card"><h3>${esc(j.title)}</h3><p><b>${esc(j.employer)}</b> · ${esc(j.location||'')}${j.deadline?` · closes ${esc(j.deadline)}`:''}</p>
<p class="mut">${esc(j.summary||'')}</p><p class="mut">✅ ${esc(j.fitReason||'')}</p>
${a?`<div class="msg ${a.status==='sent'?'ok':'warn'}">${a.status==='sent'?'Application emailed to '+esc(a.to):esc(a.reason||'Finish on the employer site')}</div>
${a.status==='manual'?`<pre class="cl">${esc(a.coverLetter)}</pre><button class="p s" data-copy="${i}">Copy cover letter</button><a class="btn" href="${esc(j.applyUrl)}" target="_blank" rel="noopener">Open application page</a>`:''}`
:`<button class="p" data-ap="${i}" ${S.busy?'disabled':''}>${j.applyEmail?'Apply now (emails your CV)':'Prepare application'}</button><a class="mut" href="${esc(j.applyUrl)}" target="_blank" rel="noopener">View listing</a>`}</div>`}).join('')}`; }
function bJobs(){ $('#srch').onclick=search;
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{ const j=S.jobs[+b.dataset.ap];
    if(!confirm(j.applyEmail?`Send your CV and a cover letter to ${j.applyEmail} for "${j.title}" at ${j.employer}?`:`Prepare a cover letter for "${j.title}" at ${j.employer}?`)) return;
    run(async()=>{ const r=await (await api('/api/apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile:S.profile,cv:S.cv,job:j,consent:true})})).json(); S.applied[j.applyUrl]={...r,reason:r.reason}; store.set('applied',S.applied); }) });
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{ const t=S.applied[S.jobs[+b.dataset.copy].applyUrl].coverLetter; (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>{S.info='Copied';render()}).catch(()=>{}) }); }

function vSettings(){ const c=cfg(); return `<div class="card"><h2>Settings</h2>
<label>Server address<input id="srv" placeholder="https://your-server.example.com" value="${esc(store.get('server',''))}"></label>
<label>Access code (if your server uses one)<input id="code" value="${esc(c.code)}"></label>
<button class="p" id="sv">Save &amp; test</button>
<button class="p s" id="reset">Delete my data from this phone</button></div>`; }
function bSettings(){ $('#sv').onclick=()=>run(async()=>{ store.set('server',$('#srv').value.trim()); store.set('code',$('#code').value.trim()); const h=await (await api('/api/health')).json();
    S.info=`Connected. AI ${h.ai?'ready':'NOT configured'}, email ${h.email?'ready':'not configured (applications will be prepared for you to send)'}.`; });
  $('#reset').onclick=()=>{ if(confirm('Delete your profile, CV and applications from this phone?')){ ['profile','cv','jobs','applied'].forEach(k=>store.set(k,null)); Object.assign(S,{profile:null,cv:null,jobs:[],applied:{},files:[],step:'docs'}); render(); } }; }

const V={docs:[vDocs,bDocs],profile:[vProfile,bProfile],cv:[vCv,bCv],jobs:[vJobs,bJobs],settings:[vSettings,bSettings]};
function render(){ renderNav(); const [v,b]=V[S.step]; $('#app').innerHTML=msgs()+v(); b(); }
$('#gear').onclick=()=>{S.step='settings';S.err='';render()};
render();
</script>
</body>
</html>
